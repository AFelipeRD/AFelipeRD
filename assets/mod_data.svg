<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="904" height="268" viewBox="0 0 904 268" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Arquitectura de datos en GCP y BigQuery</title><desc id="d">Flujo: fuentes (Qualtrics, APIs REST), ingesta con Python y SAS, BigQuery en GCP, control de calidad en Python y SQL, consumo en Looker y Power BI.</desc><style>
:root{--s0:#090C11;--s1:#12161C;--s2:#1C2127;--bd:#2E333A;--bds:#595F68;--t1:#EBE7DF;--t2:#C1BDB7;--t3:#A8ABB0;--sig:#F8AC3D;--dat:#5FC9DA;--sigd:#94682B;--datd:#306D77}
@media (prefers-color-scheme: light){:root{--s0:#F8FAFD;--s1:#F1F4F8;--s2:#E8EBF0;--bd:#D4D8DD;--bds:#82868E;--t1:#2A2E34;--t2:#42464B;--t3:#505357;--sig:#734A02;--dat:#055B66;--sigd:#CB9A5B;--datd:#62A4B0}}
text{font-family:'JetBrains Mono','Geist Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;fill:var(--t2)}
.sans{font-family:'Inter','Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
.lbl{font-size:10px;letter-spacing:.14em;fill:var(--t3)}
.ttl{font-size:16px;font-weight:650;fill:var(--t1);letter-spacing:-.01em}
.dsc{font-size:12px;fill:var(--t2)}
.tag{font-size:10px;fill:var(--t2)}
.small{font-size:9.5px;fill:var(--t3)}
.nl{font-size:9.5px;letter-spacing:.12em;fill:var(--t3)}
.nt{font-size:12px;fill:var(--t1);font-weight:600}
.card{fill:none;stroke:var(--bd);stroke-width:1}
.node{fill:var(--s1);stroke:var(--bd);stroke-width:1}
.node-hot{fill:var(--s1);stroke:var(--sigd);stroke-width:1}
.node-data{fill:var(--s1);stroke:var(--datd);stroke-width:1}
.chip{fill:none;stroke:var(--bd);stroke-width:1}
.ln{stroke:var(--datd);stroke-width:1.5;fill:none}
.ln-sig{stroke:var(--sigd);stroke-width:1.5;fill:none}
.dot-d{fill:var(--dat)} .dot-s{fill:var(--sig)}
.in,.pop,.draw,.bar,.rise-d{animation-fill-mode:backwards;animation-duration:.6s;
  animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1);animation-timing-function:linear(0.0, 0.038, 0.132, 0.261, 0.404, 0.547, 0.68, 0.797, 0.893, 0.969, 1.025, 1.062, 1.084, 1.094, 1.094, 1.087, 1.076, 1.063, 1.05, 1.036, 1.024, 1.014, 1.006, 1.0, 0.996, 0.993, 0.991, 0.991, 0.991, 0.992, 0.993, 0.995, 0.996, 0.997, 0.998, 0.999, 1)}
.in{animation-name:rise}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:center}
.draw{animation-name:draw;animation-duration:.9s;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}
.bar{animation-name:grow;animation-duration:1.1s;transform-box:fill-box;transform-origin:0 50%}
.flow{stroke-dasharray:3 5;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.5s steps(1) infinite}
.travel{animation:travel var(--tt,3.6s) cubic-bezier(.45,0,.25,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--td,200px));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

</style><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="var(--dat)"/></marker></defs><rect class="card" x=".5" y=".5" width="903" height="267" rx="12"/><g class="in" style="animation-delay:0.00s"><rect x="24" y="26" width="6" height="6" rx="1.5" fill="var(--dat)"/><text class="lbl" x="38" y="33.5">01 · DATA.ARCHITECTURE</text></g><text class="ttl sans in" x="24" y="60" style="animation-delay:0.06s">Arquitectura de datos en GCP / BigQuery</text><text class="dsc sans in" x="24" y="80" style="animation-delay:0.12s">Pipelines ETL/ELT: de la ingesta segura vía API al consumo analítico, con calidad validada.</text><g class="in" style="animation-delay:0.20s"><rect x="666.0" y="20" width="214.0" height="22" rx="11" fill="none" stroke="var(--sigd)"/><text x="773.0" y="35" text-anchor="middle" style="font-size:10.5px;fill:var(--sig);font-weight:600">−95 % tiempos de procesamiento</text></g><circle class="dot-s travel" cx="22" cy="150" r="3.5" style="--td:858px;--tt:5.2s"/><path class="ln flow" d="M169 150H196" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.25s"><rect class="node" x="22" y="120" width="144" height="60" rx="8"/><text class="nl" x="94.0" y="145.0" text-anchor="middle">SOURCES</text><text class="nt sans" x="94.0" y="162.0" text-anchor="middle" style="font-size:11px">Qualtrics · APIs REST</text></g><path class="ln flow" d="M349 150H376" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.37s"><rect class="node" x="202" y="120" width="144" height="60" rx="8"/><text class="nl" x="274.0" y="145.0" text-anchor="middle">INGEST</text><text class="nt sans" x="274.0" y="162.0" text-anchor="middle" style="font-size:11px">Python · SAS</text></g><path class="ln flow" d="M529 150H556" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.49s"><rect class="node-data" x="382" y="120" width="144" height="60" rx="8"/><text class="nl" x="454.0" y="145.0" text-anchor="middle">WAREHOUSE</text><text class="nt sans" x="454.0" y="162.0" text-anchor="middle" style="font-size:11px">BigQuery · GCP</text></g><path class="ln flow" d="M709 150H736" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.61s"><rect class="node" x="562" y="120" width="144" height="60" rx="8"/><text class="nl" x="634.0" y="145.0" text-anchor="middle">QUALITY GATE</text><text class="nt sans" x="634.0" y="162.0" text-anchor="middle" style="font-size:11px">Python / SQL</text></g><g class="pop" style="animation-delay:0.73s"><rect class="node" x="742" y="120" width="144" height="60" rx="8"/><text class="nl" x="814.0" y="145.0" text-anchor="middle">SERVE</text><text class="nt sans" x="814.0" y="162.0" text-anchor="middle" style="font-size:11px">Looker · Power BI</text></g><text class="small in" x="24" y="208" style="animation-delay:0.90s">Token ID / API REST · OAuth2 · actualización diaria en Looker · procesos documentados en runbooks</text><g class="in" style="animation-delay:0.90s"><rect class="chip" x="24.0" y="222" width="36.5" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="33.0" y="236">GCP</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="66.5" y="222" width="67.2" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="75.5" y="236">BigQuery</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="139.7" y="222" width="61.1" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="148.7" y="236">ETL/ELT</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="206.7" y="222" width="73.3" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="215.7" y="236">APIs REST</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="286.1" y="222" width="54.9" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="295.1" y="236">OAuth2</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="347.0" y="222" width="54.9" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="356.0" y="236">Python</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="407.9" y="222" width="36.5" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="416.9" y="236">SAS</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="450.3" y="222" width="36.5" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="459.3" y="236">SQL</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="492.8" y="222" width="91.8" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="501.8" y="236">Data Quality</text></g></svg>