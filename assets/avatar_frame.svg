@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--td,200px));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.sweep-x{animation:sx 7s cubic-bezier(.77,0,.175,1) infinite alternate}
.sweep-y{animation:sy 7s cubic-bezier(.77,0,.175,1) -3.5s infinite alternate}
.orbit{animation:orbit 11s linear infinite;opacity:.8}
.scanband{animation:band 6s linear infinite}
@keyframes sx{to{transform:translateX(268px)}}
@keyframes sy{to{transform:translateY(268px)}}
@keyframes orbit{to{stroke-dashoffset:-1000}}
@keyframes band{from{transform:translateY(-70px)}to{transform:translateY(278px)}}
