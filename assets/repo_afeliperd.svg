<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="128" viewBox="0 0 224 128" role="img" aria-labelledby="t d"><title id="t">Repositorio AFelipeRD</title><desc id="d">Tarjeta del repositorio AFelipeRD. Dash inicial al perfil.</desc><style>
:root{--s0:#090C11;--s1:#12161C;--s2:#1C2127;--bd:#2E333A;--bds:#595F68;--t1:#EBE7DF;--t2:#C1BDB7;--t3:#A8ABB0;--sig:#F8AC3D;--dat:#5FC9DA;--sigd:#94682B;--datd:#306D77}
@media (prefers-color-scheme: light){:root{--s0:#F8FAFD;--s1:#F1F4F8;--s2:#E8EBF0;--bd:#D4D8DD;--bds:#82868E;--t1:#2A2E34;--t2:#42464B;--t3:#505357;--sig:#734A02;--dat:#055B66;--sigd:#CB9A5B;--datd:#62A4B0}}
text{font-family:'JetBrains Mono','Geist Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;fill:var(--t2)}
.sans{font-family:'Inter','Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
.lbl{font-size:10px;letter-spacing:.14em;fill:var(--t3)}
.ttl{font-size:16px;font-weight:650;fill:var(--t1);letter-spacing:-.01em}
.dsc{font-size:12px;fill:var(--t2)}
.tag{font-size:10px;fill:var(--t2)}
.small{font-size:9.5px;fill:var(--t3)}
.nl{font-size:9.5px;letter-spacing:.12em;fill:var(--t3)}
.nt{font-size:12px;fill:var(--t1);font-weight:600}
.card{fill:none;stroke:var(--bd);stroke-width:1}
.node{fill:var(--s1);stroke:var(--bd);stroke-width:1}
.node-hot{fill:var(--s1);stroke:var(--sigd);stroke-width:1}
.node-data{fill:var(--s1);stroke:var(--datd);stroke-width:1}
.chip{fill:none;stroke:var(--bd);stroke-width:1}
.ln{stroke:var(--datd);stroke-width:1.5;fill:none}
.ln-sig{stroke:var(--sigd);stroke-width:1.5;fill:none}
.dot-d{fill:var(--dat)} .dot-s{fill:var(--sig)}
.in,.pop,.draw,.bar,.rise-d{animation-fill-mode:backwards;animation-duration:.6s;
  animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1);animation-timing-function:linear(0.0, 0.038, 0.132, 0.261, 0.404, 0.547, 0.68, 0.797, 0.893, 0.969, 1.025, 1.062, 1.084, 1.094, 1.094, 1.087, 1.076, 1.063, 1.05, 1.036, 1.024, 1.014, 1.006, 1.0, 0.996, 0.993, 0.991, 0.991, 0.991, 0.992, 0.993, 0.995, 0.996, 0.997, 0.998, 0.999, 1)}
.in{animation-name:rise}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:center}
.draw{animation-name:draw;animation-duration:.9s;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}
.bar{animation-name:grow;animation-duration:1.1s;transform-box:fill-box;transform-origin:0 50%}
.flow{stroke-dasharray:3 5;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.5s steps(1) infinite}
.travel{animation:travel var(--tt,3.6s) cubic-bezier(.45,0,.25,1) infinite}
.float{animation:float 3.6s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadowp 3.6s ease-in-out infinite}
.bob{animation:float 4.4s ease-in-out infinite}
.grow-y{transform-box:fill-box;transform-origin:50% 100%;animation:growy 1.2s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shadowp{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.82);opacity:.2}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--td,200px));opacity:0}}

.repo-float{animation:rf 4.4s ease-in-out infinite}
.orbitb{animation:ob 7s linear infinite;animation-delay:-0.0s}
.shine{transform:skewX(-18deg);animation:shn 5.2s cubic-bezier(.45,0,.25,1) infinite}
@keyframes rf{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px)}}
@keyframes ob{to{stroke-dashoffset:-1000}}
@keyframes shn{0%{transform:translateX(0) skewX(-18deg)}55%,100%{transform:translateX(314px) skewX(-18deg)}}
</style><defs><clipPath id="c"><rect x="1" y="1" width="222" height="126" rx="12"/></clipPath><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--t1)" stop-opacity="0"/><stop offset=".5" style="stop-color:var(--t1)" stop-opacity=".14"/><stop offset="1" style="stop-color:var(--t1)" stop-opacity="0"/></linearGradient></defs><g class="repo-float" style="animation-delay:-0.0s"><rect class="card" x=".5" y=".5" width="223" height="127" rx="12"/><rect class="orbitb" x=".5" y=".5" width="223" height="127" rx="12" fill="none" style="stroke:var(--dat)" stroke-width="1.6" stroke-linecap="round" pathLength="1000" stroke-dasharray="46 954" stroke-opacity=".9"/><g class="pop" style="animation-delay:0.10s"><g class="float" style="animation-delay:-0.00s"><polygon points="21,36 30,40.5 30,48.5 21,44" fill="var(--dat)" fill-opacity="0.55" stroke="var(--datd)" stroke-width="1"/><polygon points="30,40.5 39,36 39,44 30,48.5" fill="var(--dat)" fill-opacity="0.3" stroke="var(--datd)" stroke-width="1"/><polygon points="30,31.5 39,36 30,40.5 21,36" fill="var(--dat)" fill-opacity="0.9" stroke="var(--datd)" stroke-width="1"/></g></g><text class="sans in" x="52" y="40" style="animation-delay:0.15s;font-size:12px;font-weight:650;fill:var(--t1)">AFelipeRD</text><text class="sans in" x="18" y="68" style="animation-delay:0.25s;font-size:10px;fill:var(--t2)">Dash inicial al perfil.</text><g class="in" style="animation-delay:0.40s"><circle class="pulse" cx="22" cy="108" r="3.5" style="fill:var(--dat)"/><text class="tag" x="31" y="111.5">Python</text></g><g class="in" style="animation-delay:0.45s"><text class="tag" x="206" y="111.5" text-anchor="end">★ 0  ·  forks 0</text></g><g clip-path="url(#c)"><rect class="shine" x="-70" y="0" width="70" height="128" fill="url(#sh)" style="animation-delay:0.0s"/></g></g></svg>