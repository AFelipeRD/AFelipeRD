="130.8" y="228">XGBoost</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="188.9" y="214" width="42.6" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="197.9" y="228">Laya</text></g></svg>