tion-delay:1.00s">merge</text><g class="in" style="animation-delay:0.90s"><rect class="chip" x="24.0" y="214" width="36.5" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="33.0" y="228">Git</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="66.5" y="214" width="104.1" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="75.5" y="228">GitHub Actions</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="176.6" y="214" width="48.8" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="185.6" y="228">CI/CD</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="24.0" y="240" width="128.7" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="33.0" y="254">Commits semánticos</text></g></svg>