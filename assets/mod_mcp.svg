<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="292" height="268" viewBox="0 0 292 268" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Servidores MCP locales</title><desc id="d">Un LLM local (Ollama, vLLM) se conecta mediante un servidor MCP a bases de datos y APIs.</desc><style>
:root{--s0:#090C11;--s1:#12161C;--s2:#1C2127;--bd:#2E333A;--bds:#595F68;--t1:#EBE7DF;--t2:#C1BDB7;--t3:#A8ABB0;--sig:#F8AC3D;--dat:#5FC9DA;--sigd:#94682B;--datd:#306D77}
@media (prefers-color-scheme: light){:root{--s0:#F8FAFD;--s1:#F1F4F8;--s2:#E8EBF0;--bd:#D4D8DD;--bds:#82868E;--t1:#2A2E34;--t2:#42464B;--t3:#505357;--sig:#734A02;--dat:#055B66;--sigd:#CB9A5B;--datd:#62A4B0}}
text{font-family:'JetBrains Mono','Geist Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;fill:var(--t2)}
.sans{font-family:'Inter','Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
.lbl{font-size:10px;letter-spacing:.14em;fill:var(--t3)}
.ttl{font-size:16px;font-weight:650;fill:var(--t1);letter-spacing:-.01em}
.dsc{font-size:12px;fill:var(--t2)}
.tag{font-size:10px;fill:var(--t2)}
.small{font-size:9.5px;fill:var(--t3)}
.nl{font-size:9.5px;letter-spacing:.12em;fill:var(--t3)}
.nt{font-size:12px;fill:var(--t1);font-weight:600}
.card{fill:none;stroke:var(--bd);stroke-width:1}
.node{fill:var(--s1);stroke:var(--bd);stroke-width:1}
.node-hot{fill:var(--s1);stroke:var(--sigd);stroke-width:1}
.node-data{fill:var(--s1);stroke:var(--datd);stroke-width:1}
.chip{fill:none;stroke:var(--bd);stroke-width:1}
.ln{stroke:var(--datd);stroke-width:1.5;fill:none}
.ln-sig{stroke:var(--sigd);stroke-width:1.5;fill:none}
.dot-d{fill:var(--dat)} .dot-s{fill:var(--sig)}
.in,.pop,.draw,.bar,.rise-d{animation-fill-mode:backwards;animation-duration:.6s;
  animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1);animation-timing-function:linear(0.0, 0.038, 0.132, 0.261, 0.404, 0.547, 0.68, 0.797, 0.893, 0.969, 1.025, 1.062, 1.084, 1.094, 1.094, 1.087, 1.076, 1.063, 1.05, 1.036, 1.024, 1.014, 1.006, 1.0, 0.996, 0.993, 0.991, 0.991, 0.991, 0.992, 0.993, 0.995, 0.996, 0.997, 0.998, 0.999, 1)}
.in{animation-name:rise}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:center}
.draw{animation-name:draw;animation-duration:.9s;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}
.bar{animation-name:grow;animation-duration:1.1s;transform-box:fill-box;transform-origin:0 50%}
.flow{stroke-dasharray:3 5;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.5s steps(1) infinite}
.travel{animation:travel var(--tt,3.6s) cubic-bezier(.45,0,.25,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--td,200px));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

</style><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="var(--dat)"/></marker></defs><rect class="card" x=".5" y=".5" width="291" height="267" rx="12"/><g class="in" style="animation-delay:0.00s"><rect x="24" y="26" width="6" height="6" rx="1.5" fill="var(--sig)"/><text class="lbl" x="38" y="33.5">02 · LOCAL.MCP</text></g><text class="ttl sans in" x="24" y="60" style="animation-delay:0.06s">Servidores MCP locales</text><text class="dsc sans in" x="24" y="80" style="animation-delay:0.12s">LLMs en tu propia infraestructura,</text><text class="dsc sans in" x="24" y="97" style="animation-delay:0.17s">conectados a bases de datos y APIs.</text><circle class="dot-s travel" cx="20" cy="158" r="3" style="--td:236px;--tt:3.4s"/><path class="ln flow" d="M114 158H124" marker-end="url(#ah)"/><path class="ln flow" d="M190 152L202 140" marker-end="url(#ah)"/><path class="ln flow" d="M190 164L202 176" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.25s"><rect class="node-data" x="20" y="134" width="94" height="48" rx="8"/><text class="nl" x="67.0" y="153.0" text-anchor="middle">LLM LOCAL</text><text class="nt sans" x="67.0" y="170.0" text-anchor="middle" style="font-size:10.5px">Ollama · vLLM</text></g><g class="pop" style="animation-delay:0.37s"><rect class="node-hot" x="128" y="130" width="62" height="56" rx="8"/><text class="nl" x="159.0" y="153.0" text-anchor="middle">MCP</text><text class="nt sans" x="159.0" y="170.0" text-anchor="middle" style="font-size:12px">server</text></g><g class="pop" style="animation-delay:0.49s"><rect class="node" x="204" y="122" width="66" height="28" rx="8"/><text class="nt sans" x="237.0" y="140.0" text-anchor="middle">DB</text></g><g class="pop" style="animation-delay:0.55s"><rect class="node" x="204" y="166" width="66" height="28" rx="8"/><text class="nt sans" x="237.0" y="184.0" text-anchor="middle">APIs</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="24.0" y="214" width="85.7" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="33.0" y="228">100 % local</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="115.7" y="214" width="54.9" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="124.7" y="228">Ollama</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="176.6" y="214" width="42.6" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="185.6" y="228">vLLM</text></g><g class="in" style="animation-delay:0.90s"><rect class="chip" x="225.2" y="214" width="36.5" height="20" rx="10" style="stroke:var(--bd)"/><text class="tag" x="234.2" y="228">MCP</text></g></svg>